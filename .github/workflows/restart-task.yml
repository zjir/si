name: restart-task
run-name: "Restart úkolu ${{ inputs.task_id }}"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Id úkolu, např. TASK-0003"
        required: true
        type: string
      from_scratch:
        description: "Začít od kola 1 (staré kroky se archivují)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-loop-tasks
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requeue task
        id: task
        env:
          IN_TASK_ID: ${{ inputs.task_id }}
          IN_FROM_SCRATCH: ${{ inputs.from_scratch }}
        run: python3 .github/scripts/task_tool.py restart
      - name: Commit and push
        env:
          MSG: ${{ steps.task.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tasks runs
          git commit -q -m "$MSG"
          for i in 1 2 3 4 5; do
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
